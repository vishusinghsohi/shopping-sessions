name: Fused canonical identity merge A/B

on:
  push:
    branches:
      - perf/fused-canonical-merge

jobs:
  fused:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build competition C++ engine and CTest
        run: docker build --target competition -t shopping-sessions:latest .
      - name: Install Parquet comparison dependency
        run: python3 -m pip install --user 'polars>=1.0,<2'
      - name: Verify 36 official fixtures with fused canonical merge
        env:
          CPUS: '4'
          MEM: '8g'
          SESSION_FUSED_CANONICAL_MERGE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/run_fixtures.py fixtures -- python3 scripts/docker_run_windows.py
      - name: A/B fused canonical routing on 2M rows
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: fused_merge
          SORT_TEST_EVENTS: '2000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
      - name: A/B fused canonical routing on 20M rows
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: fused_merge
          SORT_TEST_EVENTS: '20000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
