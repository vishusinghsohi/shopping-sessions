name: Selective dedup fields A/B

on:
  push:
    branches:
      - perf/selective-dedup-fields

jobs:
  selective:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ engine and CTest
        run: docker build --target competition -t shopping-sessions:latest .
      - name: Install Parquet comparison dependency
        run: python3 -m pip install --user 'polars>=1.0,<2'
      - name: Verify 36 official fixtures with selective dedup parser
        env:
          CPUS: '4'
          MEM: '8g'
          SESSION_SELECTIVE_DEDUP_FIELDS: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/run_fixtures.py fixtures -- python3 scripts/docker_run_windows.py
      - name: A/B selective dedup on 2M rows
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: selective_dedup
          SORT_TEST_EVENTS: '2000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
      - name: A/B selective dedup on 20M rows
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: selective_dedup
          SORT_TEST_EVENTS: '20000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
