name: Flat shard user indexing A/B

on:
  push:
    branches:
      - perf/flat-user-validation

jobs:
  flat-users:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build C++ engine and CTest
        run: docker build --target competition -t shopping-sessions:latest .
      - name: Install Parquet comparison dependency
        run: python3 -m pip install --user 'polars>=1.0,<2'
      - name: Verify all 36 official fixtures with flat shard user indexing
        env:
          CPUS: '4'
          MEM: '8g'
          SESSION_FLAT_SHARD_USERS: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/run_fixtures.py fixtures -- python3 scripts/docker_run_windows.py
      - name: Compare 2M-event flat users with production baseline
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: flat_users
          SORT_TEST_EVENTS: '2000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
      - name: Compare 20M-event flat users with production baseline
        env:
          CPUS: '4'
          MEM: '8g'
          SORT_TEST_MODE: flat_users
          SORT_TEST_EVENTS: '20000000'
          SORT_TEST_DUPLICATES: '1'
          SORT_TEST_TRIALS: '3'
          SORT_TEST_PROFILE: '1'
        run: TEST_DOCKER_USER="$(id -u):$(id -g)" python3 scripts/test_parallel_sort.py
